name: macOS release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # Tests and the build share one job: a macOS arm64 runner is scarce, and
  # one job needs one runner, where a separate test job would need a second
  # one for the build (which is what kept failing to be acquired). macos-26
  # is the current arm64 image; macos-15's arm64 pool kept cancelling us
  # after fifteen minutes of queueing.
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify tag matches VERSION
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Run tests
        run: make test
      - name: Diagnose a failed render
        if: failure()
        run: |
          if [ ! -x .venv/bin/python ]; then
            python3 -m venv .venv
            .venv/bin/python -m pip install --quiet --disable-pip-version-check pytest
          fi
          make scotticad || true
          .venv/bin/python - <<'PY'
          import base64, struct, subprocess, sys, zlib
          sys.path.insert(0, "python")
          from scotticad import default_exe, launch

          def read_png(data):
              pos, idat, w, h, bpp = 8, b"", 0, 0, 4
              while pos < len(data):
                  n, kind = struct.unpack(">I4s", data[pos:pos + 8])
                  chunk = data[pos + 8:pos + 8 + n]
                  if kind == b"IHDR":
                      w, h, depth, ctype = struct.unpack(">IIBB", chunk[:10])
                      bpp = 3 if ctype == 2 else 4
                  elif kind == b"IDAT":
                      idat += chunk
                  pos += 12 + n
              raw, stride, rows, prev = zlib.decompress(idat), w * bpp, [], bytearray(w * bpp)
              for y in range(h):
                  f, line = raw[y * (stride + 1)], bytearray(raw[y * (stride + 1) + 1:(y + 1) * (stride + 1)])
                  for i in range(stride):
                      a = line[i - bpp] if i >= bpp else 0
                      bb, cc = prev[i], prev[i - bpp] if i >= bpp else 0
                      if f == 1: line[i] = (line[i] + a) & 255
                      elif f == 2: line[i] = (line[i] + bb) & 255
                      elif f == 3: line[i] = (line[i] + (a + bb) // 2) & 255
                      elif f == 4:
                          p = a + bb - cc
                          pa, pb, pc = abs(p - a), abs(p - bb), abs(p - cc)
                          line[i] = (line[i] + (a if pa <= pb and pa <= pc else bb if pb <= pc else cc)) & 255
                  rows.append([tuple(line[x * bpp:x * bpp + 3]) for x in range(w)])
                  prev = line
              return w, h, rows

          def shape_pixels(rows):
              # the part's colour is #2f80ed: clearly blue and not the blue Z axis
              # (which has no green). Shading keeps blue dominant.
              return [(x, y) for y, row in enumerate(rows) for x, (r, g, b) in enumerate(row)
                      if b > 120 and b - r > 60 and g > 60]

          def where(rows, cad, p):
              px, py = cad.project(*p)
              got = "off" if not (0 <= int(py) < len(rows) and 0 <= int(px) < len(rows[0])) else rows[int(py)][int(px)]
              pts = shape_pixels(rows)
              if not pts:
                  return f"project{p}=({px:.0f},{py:.0f}) colour={got} | shape=0"
              xs = [q[0] for q in pts]; ys = [q[1] for q in pts]
              return (f"project{p}=({px:.0f},{py:.0f}) colour={got} | shape={len(pts)} "
                      f"centroid=({sum(xs)/len(xs):.0f},{sum(ys)/len(ys):.0f}) "
                      f"bbox=x[{min(xs)},{max(xs)}] y[{min(ys)},{max(ys)}]")

          with launch(headless=True, width=1400, height=860) as cad:
              print("=== a plain blue box at the home view (is the mesh pipeline drawing at all?) ===")
              box = cad.add_shape("box")
              cad.set_color("#2f80ed", ids=[box])
              cad.clear_selection()
              cad.home_view()
              shot = cad.call("screenshot")
              _, _, rows = read_png(base64.b64decode(shot["png"]))
              print("plain box:", where(rows, cad, [0, 0, 0]))

              print("=== the section cut test's part ===")
              cad.new_design()
              box = cad.add_shape("box")
              cad.set_bounds(min=[-20, -20, 0], max=[20, 20, 20], ids=[box])
              hole = cad.add_shape("cylinder", hole=True)
              cad.rotate("y", 90, ids=[hole])
              cad.set_bounds(min=[-25, -4, 6], max=[25, 4, 14], ids=[hole])
              part = cad.group(ids=[box, hole])
              cad.set_color("#2f80ed", ids=[part])
              cad.clear_selection()
              print("section off:", cad.ui_state()["section"] if "section" in cad.ui_state() else "off")
              cad.set_camera(target=[0, 0, 10], yaw=0, pitch=89.9, dist=150, ortho=True)
              shot = cad.call("screenshot")
              _, _, rows = read_png(base64.b64decode(shot["png"]))
              print("no section, top-down:", where(rows, cad, [0, 0, 10]))
              print("no section, corner:", where(rows, cad, [15, 15, 10]))

              for section in (True, False):
                  if section:
                      cad.set_section(axis="z", at=10, keep="below")
                  else:
                      cad.set_section(on=False)
                  for ortho, yaw, pitch in ((True, 0, 89.9), (False, 30, 70)):
                      cad.set_camera(target=[0, 0, 10], yaw=yaw, pitch=pitch, dist=150, ortho=ortho)
                      shot = cad.call("screenshot")
                      w, h, rows = read_png(base64.b64decode(shot["png"]))
                      print(f"section={section} ortho={ortho} window={shot['width']}x{shot['height']} png={w}x{h}")
                      print("   ", where(rows, cad, [0, 0, 10]))
                      print("   ", where(rows, cad, [12, 12, 10]))

          print("=== start_api: does 'scotticad --api 127.0.0.1:0 --headless' print its line? ===")
          for i in range(3):
              p = subprocess.Popen([default_exe(), "--api", "127.0.0.1:0", "--headless"],
                                   stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
              line = p.stdout.readline()
              print(f"try{i}: first={line!r} rc={p.poll()}")
              if not line.startswith("SCOTTICAD_API "):
                  print("   stderr:", (p.stderr.read() or "")[:1500])
              p.kill()
          PY
      - name: Detect signing credentials
        id: signing
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_P12_BASE64" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && \
             [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_NOTARY_KEY_ID" ] && \
             [ -n "$APPLE_NOTARY_ISSUER_ID" ] && [ -n "$APPLE_NOTARY_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing/notarization secrets are not configured; publishing an unsigned test build."
          fi
      - name: Import signing identity and configure notarization
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/scotticad-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          notary_key="$RUNNER_TEMP/notary-key.p8"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          printf '%s' "$APPLE_NOTARY_KEY" > "$notary_key"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          xcrun notarytool store-credentials ScottiCAD \
            --key "$notary_key" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --keychain "$keychain"

          rm -f "$certificate" "$notary_key"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, and package
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ "$SIGNING_ENABLED" = "true" ]; then
            make release-macos SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" NOTARY_PROFILE=ScottiCAD
          else
            make release-macos
          fi
      - name: Write checksum
        run: |
          for archive in dist/*.zip; do
            shasum -a 256 "$archive" > "$archive.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN"

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "ScottiCAD $RELEASE_TAG" \
            --generate-notes
